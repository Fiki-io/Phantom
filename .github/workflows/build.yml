name: Build Phantom APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Preinstalled Android SDK and NDK
        run: |
          ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          if [ -d "$ANDROID_SDK_ROOT/ndk" ]; then
            PREINSTALLED_NDK=$(ls -1d $ANDROID_SDK_ROOT/ndk/* 2>/dev/null | sort -V | tail -n 1)
            if [ -n "$PREINSTALLED_NDK" ]; then
              NDK_VER=$(basename "$PREINSTALLED_NDK")
              echo "ANDROID_NDK_ROOT=$PREINSTALLED_NDK" >> $GITHUB_ENV
              echo "ANDROID_NDK_HOME=$PREINSTALLED_NDK" >> $GITHUB_ENV
              echo "ANDROID_NDK_VERSION=$NDK_VER" >> $GITHUB_ENV
              echo "Using preinstalled NDK: $PREINSTALLED_NDK (version $NDK_VER)"
            fi
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --build-cache --parallel -Pandroid.ndkPath=${ANDROID_NDK_ROOT} -Pandroid.ndkVersion=${ANDROID_NDK_VERSION}

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Phantom-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
